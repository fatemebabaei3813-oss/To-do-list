<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="min-h-screen bg-gradient-to-b from-yellow-300 via-yellow-300 to-blue-500">

    <!-- Main Container -->
    <main class="min-h-screen flex items-center justify-center px-5 py-10">

        <!-- Todo Card -->
        <section class="w-full max-w-md bg-slate-100 rounded-2xl shadow-2xl p-6">


            <!-- Header -->
            <div class="mb-6">

                <h1 class="text-2xl font-bold text-gray-700 text-center">
                    TO DO LIST
                </h1>

            </div>


            <!-- Add Todo -->
            <div class="flex gap-2 mb-5">

                <input
                    id="todoInput"
                    type="text"
                    placeholder="کار جدید را وارد کنید..."
                    class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400"
                >

                <button
                    id="addBtn"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-md font-medium transition"
                >
                    Add
                </button>

            </div>


            <!-- Tasks Counter -->
            <p class="text-sm text-gray-600 mb-4">

                You have

                <span
                    id="taskCount"
                    class="font-bold text-blue-600"
                >
                    0
                </span>

                task(s) to complete

            </p>


            <!-- Todo List -->
            <div
                id="todoList"
                class="space-y-3"
            >

                <!-- Todo items will be created by JavaScript -->

            </div>


            <!-- API Section -->
            <div class="mt-8 pt-6 border-t border-gray-300">


                <!-- API Title -->
                <h2 class="text-lg font-bold text-gray-700 mb-4">
                    اطلاعات دریافتی از سرور
                </h2>


                <!-- API Loading -->
                <div
                    id="apiData"
                    class="space-y-3"
                >

                    <p class="text-gray-500 text-center text-sm">
                        در حال دریافت اطلاعات...
                    </p>

                </div>


            </div>


        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
